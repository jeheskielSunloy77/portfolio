name: CI

on:
 pull_request:
 push:
  branches: [main]

permissions:
 contents: read

env:
 APP_URL: ${{ secrets.APP_URL != '' && secrets.APP_URL || 'https://example.com' }}
 AI_PROVIDER: ${{ secrets.AI_PROVIDER != '' && secrets.AI_PROVIDER || 'google' }}
 AI_API_KEY: ${{ secrets.AI_API_KEY != '' && secrets.AI_API_KEY || 'placeholder-ai-key' }}
 AI_MODEL: ${{ secrets.AI_MODEL != '' && secrets.AI_MODEL || 'gemini-2.5-flash' }}
 MONGODB_URI: ${{ secrets.MONGODB_URI != '' && secrets.MONGODB_URI || 'mongodb://localhost:27017/test' }}
 MONGODB_DB: ${{ secrets.MONGODB_DB != '' && secrets.MONGODB_DB || 'portfolio_ci' }}
 SMTP_URL: ${{ secrets.SMTP_URL != '' && secrets.SMTP_URL || '' }}

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v4

   - name: Setup pnpm
     uses: pnpm/action-setup@v4
     with:
      version: 11.9.0

   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 24.14.0
      cache: pnpm

   - name: Install dependencies
     run: pnpm install --frozen-lockfile

   - name: Run tests
     run: pnpm test

 build:
  needs: test
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v4

   - name: Setup pnpm
     uses: pnpm/action-setup@v4
     with:
      version: 11.9.0

   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 24.14.0
      cache: pnpm

   - name: Install dependencies
     run: pnpm install --frozen-lockfile

   - name: Build
     run: pnpm build
